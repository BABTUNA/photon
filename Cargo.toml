[package]
name = "photon"
version = "0.1.0"
edition = "2021"
description = "A small distributed Python runtime"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
memmap2 = "0.9"
blake3 = "1"
bincode = "1"
